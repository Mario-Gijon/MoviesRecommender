name: movies-recommender-dev

services:
  api:
    build:
      context: ./Backend
      target: development
    image: movies-recommender-api-dev
    environment:
      MOVIES_RECOMMENDER_DATA_DIR: /app/data
      MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT: ${MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT:-top_k_100_min_support_25}
      MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT: ${MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT:-factors_128_epochs_100_lr_0_005_reg_0_02}
    volumes:
      - ./Backend/app:/app/app
      - ./Backend/pipelines:/app/pipelines
      - ${DATA_DIR:-./data}:/app/data
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8014", "--reload"]
    ports:
      - ${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-18014}:8014
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8014/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    image: movies-recommender-frontend-dev
    volumes:
      - ./Frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["bun", "run", "dev", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - ${FRONTEND_BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173

  dataset:
    build:
      context: ./Backend
      target: dataset
    image: movies-recommender-dataset-dev
    profiles: ["dataset"]
    environment:
      MOVIES_RECOMMENDER_DATA_DIR: /app/data
      MOVIES_RECOMMENDER_TMDB_BEARER_TOKEN: ${MOVIES_RECOMMENDER_TMDB_BEARER_TOKEN:-}
    volumes:
      - ./Backend/app:/app/app
      - ./Backend/pipelines:/app/pipelines
      - ${DATA_DIR:-./data}:/app/data
    stdin_open: true
    tty: true

  recommender-build:
    build:
      context: ./Backend
      target: development
    image: movies-recommender-api-dev
    profiles: ["maintenance"]
    environment:
      MOVIES_RECOMMENDER_DATA_DIR: /app/data
      MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT: ${MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT:-top_k_100_min_support_25}
      MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT: ${MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT:-factors_128_epochs_100_lr_0_005_reg_0_02}
    volumes:
      - ./Backend/app:/app/app
      - ./Backend/pipelines:/app/pipelines
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "-m", "pipelines.recommender_build.cli"]
    stdin_open: true
    tty: true

  recommender-audit:
    build:
      context: ./Backend
      target: development
    image: movies-recommender-api-dev
    profiles: ["maintenance"]
    environment:
      MOVIES_RECOMMENDER_DATA_DIR: /app/data
      MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT: ${MOVIES_RECOMMENDER_ACTIVE_COLLABORATIVE_MODEL_VARIANT:-top_k_100_min_support_25}
      MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT: ${MOVIES_RECOMMENDER_BIASED_MATRIX_FACTORIZATION_MODEL_VARIANT:-factors_128_epochs_100_lr_0_005_reg_0_02}
    volumes:
      - ./Backend/app:/app/app
      - ./Backend/pipelines:/app/pipelines
      - ${DATA_DIR:-./data}:/app/data
    entrypoint: ["python", "-m", "pipelines.recommender_evaluation.compare_collaborative_recommenders"]

volumes:
  frontend_node_modules:
